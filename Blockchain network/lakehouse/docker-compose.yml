
# ═══════════════════════════════════════════════════════════════
# Lakehouse Data Platform — FINAL FIXED VERSION
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # 1. PostgreSQL (Hive Metastore DB)
  # ─────────────────────────────────────────────────────────────
  metastore-db:
    image: postgres:15-alpine
    container_name: lakehouse-metastore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${METASTORE_DB_NAME}
      POSTGRES_USER: ${METASTORE_DB_USER}
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD}
    volumes:
      - metastore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METASTORE_DB_USER}"]
      interval: 5s
      retries: 10
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────
  # 2. Hive Metastore
  # ─────────────────────────────────────────────────────────────
  hive-metastore:
    build: ./hive-metastore
    container_name: lakehouse-hive-metastore
    restart: unless-stopped
    depends_on:
      metastore-db:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      METASTORE_DB_HOST: metastore-db
      METASTORE_DB_PORT: 5432
      METASTORE_DB_NAME: ${METASTORE_DB_NAME}
      METASTORE_DB_USER: ${METASTORE_DB_USER}
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD}
      S3_ENDPOINT: http://minio-lakehouse:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${MINIO_BUCKET}
      HIVE_CONF_DIR: /opt/hive-metastore/conf
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────
  # 3. Spark Master
  # ─────────────────────────────────────────────────────────────
  spark:
    build: ./spark
    container_name: lakehouse-spark
    restart: unless-stopped
    command: >
      bash -c "/opt/spark/sbin/start-master.sh && tail -f /dev/null"
    ports:
      - "7077:7077"
      - "8081:8080"
      - "4040:4040"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/conf:/opt/spark/conf
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────
  # 4. Spark Worker
  # ─────────────────────────────────────────────────────────────
  spark-worker:
    build: ./spark
    container_name: lakehouse-spark-worker
    restart: unless-stopped
    depends_on:
      - spark
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark:7077 && tail -f /dev/null"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/conf:/opt/spark/conf

    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────
  # 5. Trino (FIX CHÍNH Ở ĐÂY)
  # ─────────────────────────────────────────────────────────────
  trino:
    image: trinodb/trino:438
    container_name: lakehouse-trino
    restart: unless-stopped
    depends_on:
      - hive-metastore
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/catalog:/etc/trino/catalog
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      retries: 5
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────
  # 6. Superset
  # ─────────────────────────────────────────────────────────────
  superset:
    build: ./superset
    container_name: lakehouse-superset
    restart: unless-stopped
    depends_on:
      - trino
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      TALISMAN_ENABLED: "False"
    volumes:
      - superset-data:/app/superset_home
      - ./superset/superset_config.py:/app/superset_config.py
    networks:
      - lakehouse

# ─────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  metastore-pgdata:
  superset-data:

networks:
  lakehouse:
    external: true
    name: fabric_ecommerce_network
